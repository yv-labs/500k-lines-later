name: "Scrub leak"
description: "A file contains something that identifies the private source project. Fixed same day."
title: "scrub: "
labels: ["scrub", "priority"]
body:
  - type: input
    id: file
    attributes:
      label: File and line
    validations:
      required: true
  - type: textarea
    id: term
    attributes:
      label: What leaked
      description: Quote the text. If it is a pattern rather than a word (a name format, a palette, a count), say so — those are the ones the word-list can't catch.
    validations:
      required: true
